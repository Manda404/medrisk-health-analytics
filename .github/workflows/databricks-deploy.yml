name: Databricks deployment

on:
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: Run the pipeline after deployment
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: databricks-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install "poetry==2.2.1"
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate bundle
        run: databricks bundle validate -t dev
      - name: Deploy bundle
        run: databricks bundle deploy -t dev
      - name: Run end-to-end pipeline
        if: inputs.run_pipeline
        run: databricks bundle run medrisk_classification_pipeline -t dev
