[project]
name = "medrisk-health-analytics"
version = "0.4.1"
description = "Professional medical, metabolic and lifestyle feature engineering for ML risk models"
authors = [{ name = "Rostand Surel", email = "s239150.eps@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
keywords = [
    "healthcare",
    "feature-engineering",
    "machine-learning",
    "diabetes",
    "clinical-ml",
    "mlops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "loguru>=0.7.3,<1.0",
    "pydantic>=2.13.5,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "mlflow>=3.15,<4.0",
]

[project.optional-dependencies]
mlflow = [
    "mlflow>=3.15,<4.0",
    "scikit-learn>=1.9.0",
    "cryptography>=50.0,<51.0",
    "gitpython>=3.1.59,<4.0",
    "pillow>=12.3",
    "pyarrow>=23.0.1,<26.0",
    "pyasn1>=0.6.4,<0.7",
    "sqlparse>=0.6,<1.0",
    "starlette>=1.3.1,<2.0",
]
xgboost = ["xgboost>=3.4.1"]
catboost = ["catboost>=1.2"]
lightgbm = ["lightgbm>=4.7.0"]
classical = ["scikit-learn>=1.9.0"]
explainability = ["shap>=0.42", "matplotlib>=3.11.1"]
boosting = [
    "mlflow>=3.15,<4.0",
    "xgboost>=3.4.1",
    "catboost>=1.2",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.0",
    "shap>=0.42",
    "matplotlib>=3.11.1",
    "cryptography>=50.0,<51.0",
    "gitpython>=3.1.59,<4.0",
    "pillow>=12.3",
    "pyarrow>=23.0.1,<26.0",
    "pyasn1>=0.6.4,<0.7",
    "sqlparse>=0.6,<1.0",
    "starlette>=1.3.1,<2.0",
]

[project.urls]
Homepage = "https://github.com/Manda404/medrisk-health-analytics"
Repository = "https://github.com/Manda404/medrisk-health-analytics"
Issues = "https://github.com/Manda404/medrisk-health-analytics/issues"

[tool.poetry]
packages = [{ include = "medrisk_health_analytics", from = "src" }]
include = ["src/medrisk_health_analytics/py.typed"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0"
pytest-cov = ">=7.0,<8.0"
ruff = ">=0.13,<1.0"
black = ">=26.3.1,<27.0"
mypy = ">=1.18,<2.0"
pandas-stubs = ">=2.3,<3.0"
mlflow = ">=3.15,<4.0"
pip-audit = ">=2.9,<3.0"
pre-commit = ">=4.0,<5.0"
setuptools = ">=83.0.0"

# Linting and import sorting.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-length handled by black
    "UP006",  # retain the current public typing style during this release
    "UP007",  # retain Optional/Union annotations during this release
    "UP035",  # keep typing imports until the package type style is migrated
    "UP042",  # string enums are part of the current serialized public API
    "UP045",  # Optional annotations are retained consistently in this release
]

# Formatting targets the minimum supported Python version.
[tool.black]
line-length = 100
target-version = ["py312"]

# Static typing remains compatible with Databricks Runtime 18 (Python 3.12).
[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

# Tests and coverage.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["medrisk_health_analytics"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
