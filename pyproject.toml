[tool.poetry]
name = "medrisk-health-analytics"
version = "0.2.0"
description = "Professional medical, metabolic and lifestyle feature engineering for ML risk models"
authors = ["Rostand Surel <s239150.eps@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Manda404/medrisk-health-analytics"
repository = "https://github.com/Manda404/medrisk-health-analytics"
keywords = [
    "healthcare",
    "feature-engineering",
    "machine-learning",
    "diabetes",
    "clinical-ml",
    "mlops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "medrisk_health_analytics", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0"
numpy = "^1.24"
loguru = "^0.7.3"
# Optional extras — install only what you need
mlflow      = { version = ">=2.0,<3.0",  optional = true }
xgboost     = { version = ">=1.7",  optional = true }
catboost    = { version = ">=1.2",  optional = true }
lightgbm    = { version = ">=4.0",  optional = true }
scikit-learn = { version = ">=1.3", optional = true }
shap        = { version = ">=0.42", optional = true }
matplotlib  = { version = ">=3.7",  optional = true }

[tool.poetry.extras]
# pip install medrisk-health-analytics[mlflow]
mlflow = ["mlflow", "scikit-learn"]
# pip install medrisk-health-analytics[xgboost]
xgboost = ["xgboost"]
# pip install medrisk-health-analytics[catboost]
catboost = ["catboost"]
# pip install medrisk-health-analytics[lightgbm]
lightgbm = ["lightgbm"]
# pip install medrisk-health-analytics[explainability]  → SHAP analysis + Matplotlib plots
explainability = ["shap", "matplotlib"]
# pip install medrisk-health-analytics[boosting]  → all 3 boosting libs + mlflow + explainability
boosting = ["mlflow", "xgboost", "catboost", "lightgbm", "scikit-learn", "shap", "matplotlib"]
# pip install medrisk-health-analytics[all]  → everything
all = ["mlflow", "xgboost", "catboost", "lightgbm", "scikit-learn", "shap", "matplotlib"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
ruff = "^0.4"
black = "^24.0"
mypy = "^1.10"
pandas-stubs = "^2.0"
mlflow = ">=2.0,<3.0"

# ---------------------------------------------------------------------------
# Ruff linter configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-length handled by black
    "UP006",  # keep typing.List/Dict style compatible with current codebase
    "UP007",  # keep Optional/Union style for Python 3.9 readability
    "UP035",  # keep typing imports until the package type style is migrated
]

# ---------------------------------------------------------------------------
# Black formatter configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

# ---------------------------------------------------------------------------
# Mypy type checking configuration
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
